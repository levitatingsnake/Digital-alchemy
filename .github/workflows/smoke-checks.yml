name: Digital Alchemy smoke checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/smoke-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse inline JavaScript and check discovery wiring
        run: node tests/smoke-check.mjs
